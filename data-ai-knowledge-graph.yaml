version: 0.2
name: Data and AI knowledge graph
reviewed_at: "2026-08-26"
description: >
  Spine-first knowledge graph covering data and AI from hardware to presentation.
  The spine is a strict three-level hierarchy: layer -> sub_domain -> topic.
  Everything that is not a containment relationship is expressed as a facet or an edge.
  Topics inherit facets from their sub_domain unless they declare their own.

schema:
  depth: 3
  levels: [layer, sub_domain, topic]
  rules:
    - Every topic is something a person can learn and be tested on.
    - A parent aims for 4 to 9 children. Fewer suggests merging; more suggests splitting.
    - Tools never appear in the spine. They attach via implemented_by edges.
    - A topic has exactly one parent. All other relationships are edges.

  facets:
    layer:
      - infrastructure
      - storage
      - processing
      - semantics
      - intelligence
      - serving
      - consumption
    concern:
      - none
      - orchestration
      - metadata
      - governance
      - security
      - quality
      - cost
      - reliability
      - engineering-practice
      - operating-model
    stage: [design, build, operate, retire]
    role:
      - platform
      - data_engineer
      - analytics_engineer
      - ml_engineer
      - analyst
      - scientist
    maturity: [stable, evolving, emerging]

  edge_types:
    requires: A cannot be understood or used without B.
    part_of: A is a component of B across the spine, not under it.
    implemented_by: A is realised by tool or product B.
    alternative_to: A and B solve the same problem differently.
    enables: A makes B possible downstream.
    governed_by: A is constrained by cross-cutting concern B.

