<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Analytics Systems Map</title>
<meta name="description" content="Interactive 3D map of analytics-system responsibilities, from the MicroStrategy stack to the modern data stack.">
<style>
  :root {
    --bg: #060a14;
    --panel: rgba(11, 17, 32, 0.68);
    --panel-solid: #0b1120;
    --line: rgba(150, 175, 230, 0.14);
    --line-strong: rgba(150, 175, 230, 0.28);
    --text: #e7edff;
    --muted: #8c99bb;
    --faint: #5d6a8c;
    --accent: #7aa2ff;
    --mstr: #ff5470;
    --modern: #5ee6c8;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased;
    overscroll-behavior: none; touch-action: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  a { color: #9db8ff; text-decoration: none; }
  a:hover { text-decoration: underline; }

  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }
  .label-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(3, 5, 12, 0.75) 100%); }

  .panel {
    position: fixed; z-index: 5; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }
  .eyebrow { font: 600 10.5px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

  /* ---------- header ---------- */
  #brand { position: fixed; z-index: 6; top: 18px; left: 20px; width: 270px; }
  #brand h1 { margin: 6px 0 4px; font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
  #brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
  #brand .row { display: flex; align-items: center; gap: 8px; }
  #brand .pip { width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, var(--mstr), var(--modern)); box-shadow: 0 0 12px var(--modern); }
  #reset { margin-left: auto; font: 600 10.5px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 9px; }
  #reset:hover { color: var(--text); border-color: var(--line-strong); }

  /* ---------- layer rail ---------- */
  #rail { top: 150px; left: 16px; width: 280px; bottom: 148px; padding: 10px; overflow-y: auto; scrollbar-width: thin; }
  #rail .eyebrow { padding: 6px 8px 10px; display: flex; justify-content: space-between; }
  #rail ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column-reverse; gap: 2px; }
  .layer-btn { width: 100%; display: grid; grid-template-columns: 28px 1fr; align-items: start; gap: 8px; padding: 8px; border-radius: 10px; text-align: left; position: relative; }
  .layer-btn::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px; border-radius: 2px; background: var(--c); opacity: 0.35; transition: opacity .2s; }
  .layer-btn:hover { background: rgba(255, 255, 255, 0.04); }
  .layer-btn .num { font: 600 11px/1.5 var(--mono); color: var(--c); }
  .layer-btn .nm { font-weight: 600; font-size: 13.5px; }
  .layer-btn .q { display: block; color: var(--muted); font-size: 12px; font-weight: 400; margin-top: 2px; max-height: 0; overflow: hidden; transition: max-height .3s ease; }
  li.open .layer-btn { background: rgba(255, 255, 255, 0.055); }
  li.open .layer-btn::before { opacity: 1; box-shadow: 0 0 10px var(--c); }
  li.open .layer-btn .q { max-height: 60px; }
  .caps { display: none; flex-direction: column; gap: 1px; padding: 4px 0 8px 36px; }
  li.open .caps { display: flex; }
  .cap-btn { text-align: left; padding: 5px 8px; border-radius: 7px; font-size: 12.5px; color: #c9d3ef; display: flex; gap: 8px; align-items: baseline; }
  .cap-btn::before { content: ""; flex: none; width: 5px; height: 5px; border-radius: 1px; background: var(--c); transform: translateY(-1px); }
  .cap-btn.new::before { border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
  .cap-btn:hover, .cap-btn.sel { background: rgba(255, 255, 255, 0.06); color: var(--text); }
  .cap-btn[aria-disabled="true"] { opacity: 0.4; }

  /* ---------- inspector ---------- */
  #inspector { top: 16px; right: 16px; width: 360px; bottom: 148px; padding: 18px 18px 16px; overflow-y: auto; scrollbar-width: thin; }
  #inspector h2 { margin: 8px 0 6px; font-size: 20px; line-height: 1.25; font-weight: 650; letter-spacing: -0.01em; }
  #inspector p { margin: 0 0 12px; color: #c4cde6; }
  #inspector .q { font-size: 15px; color: var(--text); font-style: italic; }
  #inspector .sub { color: var(--muted); font-size: 12.5px; }
  #inspector .close { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 8px; color: var(--muted); display: none; }
  #inspector .close:hover { color: var(--text); background: rgba(255,255,255,.06); }
  .crumb { display: inline-flex; align-items: center; gap: 6px; }
  .crumb i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .crumb:hover { color: var(--text); }
  .lens-cards { display: grid; gap: 8px; margin: 14px 0; }
  .lens-card { border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; position: relative; transition: border-color .3s, background .3s, opacity .3s; opacity: 0.62; }
  .lens-card .eyebrow { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .lens-card .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--k); }
  .lens-card b { display: block; font-size: 13.5px; margin-bottom: 3px; }
  .lens-card span { color: #b9c3df; font-size: 12.8px; }
  .lens-card.on { opacity: 1; border-color: color-mix(in srgb, var(--k) 55%, transparent); background: color-mix(in srgb, var(--k) 8%, transparent); }
  .lens-card.mstr { --k: var(--mstr); } .lens-card.modern { --k: var(--modern); }
  .why { border-left: 2px solid var(--c, var(--accent)); padding: 2px 0 2px 12px; margin: 12px 0; color: #d6def5; font-size: 13.3px; }
  .lesson { margin: 14px 0; padding: 12px 14px; border-radius: 11px; background: rgba(255,255,255,.035); font-size: 13.3px; color: #d6def5; }
  .lesson .eyebrow { display: block; margin-bottom: 6px; }
  h4 { margin: 18px 0 8px; font: 600 10.5px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .cap-table { display: grid; gap: 2px; }
  .cap-row { display: grid; grid-template-columns: 1fr 14px 1fr; gap: 6px; align-items: center; text-align: left; padding: 7px 8px; border-radius: 8px; font-size: 12.3px; }
  .cap-row:hover { background: rgba(255,255,255,.05); }
  .cap-row .a { color: #f3b3c0; } .cap-row .b { color: #a9f0df; } .cap-row .arr { color: var(--faint); text-align: center; }
  .cap-row .a.none { color: var(--faint); font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 12px; color: #cdd6f0; }
  .chip i { width: 6px; height: 6px; border-radius: 2px; background: var(--c); }
  .chip:hover { border-color: var(--line-strong); color: var(--text); }
  .ms { display: grid; grid-template-columns: 44px 1fr; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
  .ms .y { font: 600 12px/1.5 var(--mono); color: var(--modern); }
  .ms .w { grid-column: 2; color: var(--muted); }
  .qs { display: grid; gap: 8px; margin: 14px 0; }
  .q-btn { display: grid; grid-template-columns: 22px 1fr; gap: 10px; text-align: left; border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
  .q-btn:hover { border-color: var(--line-strong); background: rgba(255,255,255,.035); }
  .q-btn .n { font: 600 12px/1.5 var(--mono); color: var(--accent); }
  .q-btn b { display: block; font-size: 13.5px; }
  .q-btn span { color: var(--muted); font-size: 12px; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  kbd { font: 600 10.5px/1 var(--mono); color: #cdd6f0; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; padding: 3px 6px; display: inline-block; min-width: 20px; text-align: center; }

  /* ---------- dock ---------- */
  #dock { left: 16px; right: 16px; bottom: 16px; padding: 12px 14px; display: grid; grid-template-columns: auto auto 1fr; gap: 10px 22px; align-items: center; }
  .dock-group { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .dock-label { font: 600 10px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
  .seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: rgba(0,0,0,.3); border: 1px solid var(--line); border-radius: 999px; padding: 3px; min-width: 290px; }
  .seg button { position: relative; z-index: 1; padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: color .25s; white-space: nowrap; }
  .seg button[aria-pressed="true"] { color: #fff; }
  .seg-thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 999px; transition: transform .45s cubic-bezier(.65,0,.35,1), background .45s, box-shadow .45s;
    background: linear-gradient(135deg, rgba(255,84,112,.38), rgba(255,84,112,.16)); box-shadow: 0 0 18px rgba(255,84,112,.35), inset 0 0 0 1px rgba(255,84,112,.55); }
  .seg[data-v="1"] .seg-thumb { transform: translateX(100%);
    background: linear-gradient(135deg, rgba(94,230,200,.32), rgba(94,230,200,.12)); box-shadow: 0 0 18px rgba(94,230,200,.3), inset 0 0 0 1px rgba(94,230,200,.5); }
  .traces { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .tr-btn { white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12.3px; color: #c9d3ef; display: inline-flex; align-items: center; gap: 7px; }
  .tr-btn::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--t); box-shadow: 0 0 8px var(--t); }
  .tr-btn:hover { border-color: var(--line-strong); color: var(--text); }
  .tr-btn[aria-pressed="true"] { border-color: var(--t); color: #fff; background: color-mix(in srgb, var(--t) 14%, transparent); }

  .timeline { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr minmax(240px, 34%); gap: 14px; align-items: center; padding-top: 10px; border-top: 1px solid var(--line); }
  #yearPlay { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; color: var(--modern); }
  #yearPlay:hover { background: rgba(94,230,200,.1); }
  .tl-track { position: relative; height: 34px; }
  .tl-ticks { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .tick { position: absolute; top: 0; transform: translateX(-50%); font: 600 9.5px/1 var(--mono); color: var(--faint); pointer-events: auto; padding: 2px; }
  .tick::after { content: ""; display: block; margin: 5px auto 0; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); transition: background .2s, box-shadow .2s; }
  .tick.past { color: #9aa8c9; } .tick.past::after { background: var(--modern); }
  .tick.now { color: #fff; } .tick.now::after { background: #fff; box-shadow: 0 0 10px var(--modern); }
  .tick:nth-child(even) { top: auto; bottom: -3px; display: flex; flex-direction: column-reverse; }
  .tick:nth-child(even)::after { margin: 0 auto 5px; }
  #year { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); width: 100%; margin: 0; -webkit-appearance: none; appearance: none; background: transparent; height: 18px; cursor: pointer; }
  #year::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(90deg, var(--modern) var(--p, 100%), rgba(150,175,230,.18) var(--p, 100%)); border-radius: 2px; }
  #year::-moz-range-track { height: 2px; background: rgba(150,175,230,.18); }
  #year::-moz-range-progress { height: 2px; background: var(--modern); }
  #year::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(94,230,200,.25), 0 0 14px var(--modern); }
  #year::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(94,230,200,.25); }
  .tl-cap { font-size: 12.3px; color: #c4cde6; min-height: 34px; display: flex; align-items: center; gap: 10px; }
  .tl-cap .yr { font: 650 20px/1 var(--mono); color: #fff; letter-spacing: -0.02em; white-space: nowrap; }
  .tl-cap .tx { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tl-cap .tx b { color: var(--text); }
  body[data-lens="0"] .timeline { opacity: .55; }
  body[data-lens="0"] .timeline:hover { opacity: .85; }

  /* ---------- trace caption ---------- */
  #caption { top: 16px; width: min(470px, calc(100vw - 32px)); transform: translateX(-50%); padding: 14px 16px 12px; border-color: color-mix(in srgb, var(--t, var(--accent)) 40%, transparent); }
  #caption[hidden] { display: none; }
  .cap-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .cap-head .eyebrow { color: var(--t); }
  #capQ { margin: 6px 0 8px; font-size: 12px; color: var(--muted); font-style: italic; }
  #capStep { margin: 0 0 4px; font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  #capStep i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); box-shadow: 0 0 8px var(--c); flex: none; }
  #capText { margin: 0; color: #d0d8f0; font-size: 13.3px; min-height: 38px; }
  .cap-ctrl { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
  .cap-ctrl button { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 12px; color: #c9d3ef; }
  .cap-ctrl button:hover { border-color: var(--line-strong); color: #fff; }
  .cap-ctrl .sp { flex: 1; }
  .cap-dots { display: flex; gap: 4px; }
  .cap-dots span { width: 14px; height: 3px; border-radius: 2px; background: rgba(150,175,230,.2); transition: background .3s; }
  .cap-dots span.on { background: var(--t); }

  /* ---------- 3D labels ---------- */
  .nl-wrap, .ll-wrap, .ml-wrap { pointer-events: none; }
  .nl { transform: translateY(-24px); display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px 3px 6px; border-radius: 7px; white-space: nowrap;
    font: 550 11px/1.3 var(--sans); color: #e3eaff; background: rgba(7, 11, 22, 0.78);
    border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); pointer-events: auto; cursor: pointer; transition: border-color .2s, background .2s; will-change: opacity; }
  .nl i { width: 6px; height: 6px; border-radius: 2px; background: var(--c); flex: none; }
  .nl.new i { border-radius: 50%; }
  .nl:hover, .nl.hot { background: rgba(14, 22, 42, 0.95); border-color: var(--c); }
  .nl.cur { box-shadow: 0 0 0 1px var(--c), 0 0 16px color-mix(in srgb, var(--c) 60%, transparent); }
  .ll { display: inline-flex; align-items: baseline; gap: 7px; transform: translateX(-50%); white-space: nowrap; pointer-events: auto; cursor: pointer;
    font: 600 11.5px/1 var(--sans); color: #cfd8f3; padding: 5px 9px; border-radius: 7px; transition: background .2s, color .2s; }
  .ll b { font: 650 10.5px/1 var(--mono); color: var(--c); }
  .ll:hover, .ll.on { color: #fff; background: rgba(255,255,255,.06); }
  .ml { text-align: center; white-space: nowrap; transform: translateY(-10px); }
  .ml .k { font: 650 10px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--mstr); text-shadow: 0 0 12px rgba(255,84,112,.6); }
  .ml .s { margin-top: 5px; font-size: 11.5px; color: #e9c7cf; }
  .ml.modern .k { color: var(--modern); text-shadow: 0 0 12px rgba(94,230,200,.6); }
  .ml.modern .s { color: #bfeee2; }
  .note { font-size: 11px; color: #9ba8c8; white-space: nowrap; border: 1px dashed rgba(150,175,230,.3); padding: 4px 8px; border-radius: 7px; background: rgba(6,10,20,.6); }

  #tooltip { position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; padding: 9px 11px; border-radius: 10px; background: rgba(8, 12, 24, 0.95); border: 1px solid var(--line-strong);
    font-size: 12px; max-width: 280px; opacity: 0; transition: opacity .15s; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #tooltip.on { opacity: 1; }
  #tooltip .t { font-weight: 650; margin-bottom: 5px; font-size: 12.5px; }
  #tooltip .r { display: grid; grid-template-columns: 62px 1fr; gap: 6px; color: #c4cde6; }
  #tooltip .r em { font: 600 9.5px/1.6 var(--mono); letter-spacing: .08em; text-transform: uppercase; font-style: normal; }
  #tooltip .r.m em { color: var(--mstr); } #tooltip .r.n em { color: var(--modern); }

  #fallback { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: var(--muted); }

  /* ---------- compact layout ---------- */
  @media (max-width: 980px) {
    #brand { width: auto; right: 16px; top: 12px; left: 16px; }
    #brand h1 { font-size: 16px; margin: 4px 0 0; } #brand p { display: none; }
    #rail { top: 66px; left: 0; right: 0; bottom: auto; width: auto; padding: 0 12px; background: none; border: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; overflow: visible; }
    #rail > .eyebrow { display: none; }
    #rail ol { flex-direction: row; overflow-x: auto; scrollbar-width: none; gap: 6px; padding-bottom: 2px; }
    #rail li { flex: none; }
    .layer-btn { display: inline-flex; width: auto; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); backdrop-filter: blur(10px); }
    .layer-btn::before, .layer-btn .q, .caps, li.open .caps { display: none; }
    .layer-btn .nm { font-size: 12px; }
    .layer-btn .nm .full { display: none; }
    li.open .layer-btn { border-color: var(--c); }
    #inspector { top: auto; left: 8px; right: 8px; width: auto; max-height: 46vh; bottom: calc(var(--dock-h, 170px) + 22px); display: none; padding-top: 16px; }
    #inspector.has-content { display: block; }
    #inspector .close { display: grid; place-items: center; }
    #dock { grid-template-columns: 1fr; left: 8px; right: 8px; bottom: 8px; padding: 10px; gap: 8px; }
    .seg { min-width: 0; width: 100%; }
    .dock-group { justify-content: space-between; }
    .dock-label { display: none; }
    .timeline { grid-template-columns: auto 1fr; }
    .tl-cap { grid-column: 1 / -1; min-height: 0; }
    .tl-cap .yr { font-size: 15px; }
    #caption { top: 108px; padding: 12px; }
    .ll { display: none; }
    #capText { min-height: 0; font-size: 12.8px; }
  }
  @media (min-width: 981px) { .layer-btn .nm .short { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body data-lens="0">
<div id="stage" aria-hidden="true"></div>
<div class="vignette"></div>

<header id="brand">
  <div class="row"><span class="pip"></span><span class="eyebrow">Analytics systems map</span></div>
  <h1>Where does each responsibility live?</h1>
  <p>Seven layers of an analytics system, seen through the MicroStrategy stack and the modern data stack.</p>
</header>

<nav id="rail" class="panel" aria-label="Layers">
  <div class="eyebrow"><span>Layers</span><button id="reset" type="button" title="Reset view (0)">Reset</button></div>
  <ol id="layerList"></ol>
</nav>

<aside id="inspector" class="panel" aria-live="polite"></aside>

<div id="caption" class="panel" hidden role="region" aria-label="Trace">
  <div class="cap-head"><span class="eyebrow" id="capTitle"></span><div class="cap-dots" id="capDots"></div></div>
  <p id="capQ"></p>
  <h3 id="capStep"></h3>
  <p id="capText"></p>
  <div class="cap-ctrl">
    <button id="capPrev" type="button" aria-label="Previous step">←</button>
    <button id="capPlay" type="button">Pause</button>
    <button id="capNext" type="button" aria-label="Next step">→</button>
    <span class="sp"></span>
    <button id="capClose" type="button">Close</button>
  </div>

function dotTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.22, 'rgba(255,255,255,0.85)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
function gridTexture() {
  const w = 1024, h = Math.round((1024 * SLAB_D) / SLAB_W);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const step = w / (SLAB_W * 2);
  g.strokeStyle = 'rgba(255,255,255,0.22)'; g.lineWidth = 1;
  for (let x = step; x < w; x += step) { g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, h); g.stroke(); }
  for (let y = step; y < h; y += step) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(w, y + 0.5); g.stroke(); }
  g.fillStyle = 'rgba(255,255,255,0.55)';
  for (let x = step * 4; x < w; x += step * 4) for (let y = step * 4; y < h; y += step * 4) g.fillRect(x - 1.5, y - 1.5, 3, 3);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
const DOT = dotTexture();
const GRID = gridTexture();

function layoutModern(layer) {
  const list = NODES.filter((n) => n.L === layer);
  const k = list.length, span = Math.min(14.2, 2.4 * (k - 1));
  list.forEach((n, i) => {
    const x = k === 1 ? 0 : -span / 2 + (span * i) / (k - 1);
    const z = (i % 2 === 0 ? -1 : 1) * (k > 4 ? 1.15 : 0.7);
    n.posNew = new THREE.Vector3(x, layerY(layer), z);
  });
}
function layoutOld(layer) {
  const list = NODES.filter((n) => n.L === layer && !n.modernOnly);
  const sp = layer === 0 ? 3.0 : 1.55, k = list.length;
  list.forEach((n, i) => {

    const z = layer === 0 ? 0.3 : (i % 2 === 0 ? -0.42 : 0.42);
    n.posOld = new THREE.Vector3(x, layerY(layer), z);

  NODES.filter((n) => n.L === layer && n.modernOnly).forEach((n) => { n.posOld = n.posNew.clone(); });
}

/* =====================================================================
   Edges, flow particles, trace trail
   ===================================================================== */

const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
function curveInto(a, b, out) {
  const dy = b.y - a.y;
  const p0 = tmpA.copy(a), p3 = tmpB.copy(b);
  let c1, c2;
  if (Math.abs(dy) < 0.01) {
    const lift = 0.45 + a.distanceTo(b) * 0.09;
    p0.y += 0.17; p3.y += 0.17;
    c1 = new THREE.Vector3(p0.x, p0.y + lift, p0.z);
    c2 = new THREE.Vector3(p3.x, p3.y + lift, p3.z);
  } else {
    const s = Math.sign(dy);
    p0.y += 0.17 * s; p3.y -= 0.17 * s;
    const k = (p3.y - p0.y) * 0.55;
    c1 = new THREE.Vector3(p0.x, p0.y + k, p0.z);
    c2 = new THREE.Vector3(p3.x, p3.y - k, p3.z);
  }
  for (let i = 0; i < out.length; i++) {
    const t = i / (out.length - 1), u = 1 - t;
    out[i].set(
      u * u * u * p0.x + 3 * u * u * t * c1.x + 3 * u * t * t * c2.x + t * t * t * p3.x,
      u * u * u * p0.y + 3 * u * u * t * c1.y + 3 * u * t * t * c2.y + t * t * t * p3.y,
      u * u * u * p0.z + 3 * u * u * t * c1.z + 3 * u * t * t * c2.z + t * t * t * p3.z,
    );
  }
}
function sample(pts, u, out) {
  const f = clamp(u) * (pts.length - 1), i = Math.min(pts.length - 2, Math.floor(f));
  return out.lerpVectors(pts[i], pts[i + 1], f - i);
}

const edges = EDGES.map(([a, b]) => {
  const A = byId.get(a), B = byId.get(b);
  const pts = Array.from({ length: N_SEG }, () => new THREE.Vector3());
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N_SEG * 3), col = new Float32Array(N_SEG * 3);
  for (let i = 0; i < N_SEG; i++) {
    const c = A.color.clone().lerp(B.color, i / (N_SEG - 1));
    col.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.4, depthWrite: false, blending: THREE.AdditiveBlending }));
  line.frustumCulled = false;
  scene.add(line);
  return { A, B, pts, line, pos, alpha: 0.4, phase: Math.random() };
});

const PER_EDGE = 2;
const flow = (() => {
  const n = edges.length * PER_EDGE;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.22, map: DOT, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  pts.frustumCulled = false;
  scene.add(pts);
  return { geo, pos, col };
})();

const TRAIL_MAX = 16 * N_SEG;
const trail = (() => {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(TRAIL_MAX * 3);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setDrawRange(0, 0);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, depthWrite: false, blending: THREE.AdditiveBlending }));
  line.frustumCulled = false;
  scene.add(line);
  const beads = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.13, map: DOT, color: 0xffffff, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  beads.frustumCulled = false;
  scene.add(beads);
  const pulse = new THREE.Sprite(new THREE.SpriteMaterial({ map: DOT, color: 0xffffff, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  pulse.scale.setScalar(1.1); pulse.visible = false;
  scene.add(pulse);
  return { geo, pos, line, beads, pulse, seg: Array.from({ length: N_SEG }, () => new THREE.Vector3()), anim: null };

/* =====================================================================
   Frame loop
   ===================================================================== */

const v3 = new THREE.Vector3(), v3b = new THREE.Vector3();
let last = performance.now(), frameNo = 0, lastE = -1;

function nodeTargetAlpha(n, e, visited) {

  if (state.focus !== null && n.L !== state.focus) a *= 0.2;
  if (state.trace) a = visited.has(n.id) ? Math.max(a, 1) : a * 0.22;
  else if (state.selected) {
    if (n.id !== state.selected && !neighbors.get(state.selected).has(n.id)) a *= 0.32;
  }
  return a;
}

function declutter() {
  const placed = [];
  for (const s of slabs) {
    if (s.obj.element.style.display === 'none') continue;
    const r = s.btn.getBoundingClientRect();
    if (r.width) placed.push({ x0: r.left, x1: r.right, y0: r.top, y1: r.bottom });
  }
  const visited = traceVisited();
  const cur = state.trace ? stepNode(TRACES[state.trace.key].steps[state.trace.i]) : null;
  const cand = [];
  for (const n of NODES) {
    if (!n.g.visible || n.alpha < 0.12) { n.clutter = true; continue; }
    if (!n.w) { n.w = n.el.offsetWidth; n.h = n.el.offsetHeight; }
    v3.copy(n.obj.position).project(camera);
    const x = (v3.x + 1) / 2 * viewW, y = (1 - v3.y) / 2 * viewH - 24;
    const pri = (n.id === state.selected ? 1000 : 0) + (n.id === state.hover ? 900 : 0) + (n.id === cur ? 800 : 0)
      + (visited.has(n.id) ? 400 : 0) + (state.focus === n.L ? 300 : 0)
      + (state.selected && neighbors.get(state.selected).has(n.id) ? 250 : 0) + n.alpha * 100 - v3.z * 50;
    cand.push({ n, pri, x0: x - n.w / 2 - 2, x1: x + n.w / 2 + 2, y0: y - n.h / 2 - 1, y1: y + n.h / 2 + 1 });
  }
  cand.sort((a, b) => b.pri - a.pri);
  for (const c of cand) {
    const hit = placed.some((p) => c.x0 < p.x1 && c.x1 > p.x0 && c.y0 < p.y1 && c.y1 > p.y0);
    c.n.clutter = hit && c.pri < 800;

function frame(now) {

  /* slabs: layers 2–7 contract into the monolith footprint under the MicroStrategy lens */

    const sx = i === 0 ? 1 : lerp((MONO_W - 0.35) / SLAB_W, 1, e);
    const sz = i === 0 ? 1 : lerp((MONO_D - 0.3) / SLAB_D, 1, e);
    s.g.scale.set(sx, 1, sz);

    s.alpha += (target - s.alpha) * Math.min(1, dt * 7);

    s.gridMesh.material.opacity = 0.2 * s.alpha;
    s.body.material.opacity = 0.06 * s.alpha;
    s.obj.position.set(-(SLAB_W * sx) / 2 - 0.3, layerY(i) - 0.2, (SLAB_D * sz) / 2);

  const mA = 1 - smooth(e * 1.6);

  const lensShown = state.t < 0.5 ? 0 : 1;
  for (const n of NODES) {
    n.cur.lerpVectors(n.posOld, n.posNew, e);
    const pres = n.modernOnly ? smooth((e - 0.35) / 0.55) : 1;
    n.g.visible = pres > 0.01;
    n.g.position.copy(n.cur);

    const target = nodeTargetAlpha(n, e, visited);

    n.g.scale.set(lerp(0.8, 1, e) * k, lerp(0.42, 1, e) * k, lerp(0.8, 1, e) * k);

    n.body.material.depthWrite = n.alpha > 0.9;

    const flashing = n.flash > time;
    const ringOn = n.id === state.selected || n.id === cur || flashing;
    n.ring.material.opacity = ringOn ? (0.55 + 0.4 * Math.sin(time * 5)) * Math.max(n.alpha, 0.6) : 0;
    n.ring.material.color.set(n.id === cur && state.trace ? TRACES[state.trace.key].color : flashing ? '#5ee6c8' : '#ffffff');
    n.ring.scale.setScalar(1 + (flashing ? 0.25 * Math.sin(time * 6) ** 2 : 0));

    /* labels */
    if (n.shownLens !== lensShown) {
      n.textEl.textContent = label(n, lensShown);
      n.shownLens = lensShown; n.w = 0;
    }
    n.obj.position.set(n.g.position.x, n.g.position.y + 0.22, n.g.position.z);
    const la = (n.clutter ? 0 : 1) * clamp(n.alpha * 1.15) * (pres > 0.6 ? 1 : 0);
    n.labelA += (la - n.labelA) * Math.min(1, dt * 12);
    n.obj.visible = n.labelA > 0.03;
    const op = n.labelA.toFixed(2);
    if (n.el.style.opacity !== op) n.el.style.opacity = op;
    n.el.classList.toggle('cur', n.id === cur || n.id === state.selected);
    n.el.classList.toggle('hot', n.id === state.hover);
  }

  /* edges */
  const moved = Math.abs(e - lastE) > 1e-4;
  for (const ed of edges) {
    if (moved) {
      curveInto(ed.A.cur, ed.B.cur, ed.pts);
      for (let i = 0; i < N_SEG; i++) ed.pos.set([ed.pts[i].x, ed.pts[i].y, ed.pts[i].z], i * 3);
      ed.line.geometry.attributes.position.needsUpdate = true;
    }
    const presA = ed.A.modernOnly ? smooth((e - 0.35) / 0.55) : 1, presB = ed.B.modernOnly ? smooth((e - 0.35) / 0.55) : 1;
    let a = Math.min(ed.A.alpha, ed.B.alpha) * Math.min(presA, presB);
    if (state.trace) a *= visited.has(ed.A.id) && visited.has(ed.B.id) ? 0.9 : 0.4;
    if (state.selected && (ed.A.id === state.selected || ed.B.id === state.selected)) a = Math.max(a, 1.4);
    ed.alpha += (a - ed.alpha) * Math.min(1, dt * 7);
    ed.line.material.opacity = 0.42 * ed.alpha;
    ed.line.visible = ed.alpha > 0.01;
  }
  if (moved) { if (state.trace) buildTrail(!trail.anim); lastE = e; }

  /* flow particles */
  const speed = reduced ? 0 : 0.22;
  edges.forEach((ed, i) => {
    for (let j = 0; j < PER_EDGE; j++) {
      const idx = i * PER_EDGE + j;
      const u = (time * speed + ed.phase + j / PER_EDGE) % 1;
      sample(ed.pts, u, v3b);
      flow.pos.set([v3b.x, v3b.y, v3b.z], idx * 3);
      const c = ed.A.color, b = ed.alpha * 1.25 * Math.sin(u * Math.PI);
      flow.col.set([c.r * b, c.g * b, c.b * b], idx * 3);
    }
  });
  flow.geo.attributes.position.needsUpdate = true;
  flow.geo.attributes.color.needsUpdate = true;

  /* trace pulse */
  if (state.trace) {
    if (trail.anim) {
      const k = clamp((now - trail.anim.start) / trail.anim.dur);
      curveInto(byId.get(trail.anim.from).cur, byId.get(trail.anim.to).cur, trail.seg);
      sample(trail.seg, ease(k), v3b);
      trail.pulse.position.copy(v3b);
      if (k >= 1) { trail.anim = null; buildTrail(true); }
    } else if (cur) {
      trail.pulse.position.copy(byId.get(cur).g.position).add(v3b.set(0, 0.32, 0));
    }
    trail.pulse.visible = !!cur || !!trail.anim;
    trail.pulse.scale.setScalar(1 + 0.15 * Math.sin(time * 4));
    trail.line.material.opacity = 0.75 + 0.2 * Math.sin(time * 3);
  }

  dust.rotation.y += dt * 0.006;

  if (frameNo % 3 === 0) declutter();
  composer.render();
  labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* =====================================================================
   Boot
   ===================================================================== */

renderRail();
renderInspector();
initYearCaption();
setLens(0, { instant: true });
layout();
requestAnimationFrame(frame);
</script>
</body>
</html>
